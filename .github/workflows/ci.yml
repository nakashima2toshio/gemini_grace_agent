name: CI

# モックベースのユニット/結合テストを回す品質ゲート。
# 実 API キー・Qdrant・Celery/Redis を必要とするテストは skipif/モジュールスキップで
# 自動的に除外されるため、シークレット無しで動作する。
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# 同一ブランチで新しい push が来たら古い実行をキャンセルする
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies (dev)
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      # 実 API キー/Qdrant/Redis は CI に渡さない。
      # 依存する統合テストは skipif（_has_real_gemini_key）やモジュールスキップで除外される。
      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest tests/ -q -p no:cacheprovider

  lint:
    name: ruff (non-blocking)
    runs-on: ubuntu-latest
    # lint 指摘は情報提供のみとし、現時点では CI をブロックしない
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies (dev)
        run: uv sync --extra dev

      - name: Ruff check
        run: uv run ruff check .
